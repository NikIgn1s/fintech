spring:
  application:
    name: finflow-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finflow}
    username: ${DB_USER:finflow}
    password: ${DB_PASSWORD:finflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      org.hibernate.envers.store_data_at_delete: true
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: finflow-core
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  shutdown: graceful

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

finflow:
  monitoring:
    token: ${MONITORING_TOKEN:}
  analytics:
    refresh-enabled: ${ANALYTICS_REFRESH_ENABLED:true}
    refresh-interval: 900000
  ml:
    retry-enabled: ${ML_RETRY_ENABLED:true}
    retry-interval: 300000
    url: ${ML_URL:http://localhost:8000}
    api-key: ${ML_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
    issuer: finflow
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval: 500
    initial-delay: 1000
    batch-size: 100
    send-timeout: 5s
    retention: 7d
  kafka:
    listeners:
      enabled: ${KAFKA_LISTENERS_ENABLED:true}
    retry:
      initial-interval: 500ms
      multiplier: 2.0
      max-retries: 3
  fraud:
    fallback:
      enabled: ${FRAUD_FALLBACK_ENABLED:true}
      timeout: 30s
      poll-interval: 10000
      batch-size: 100
    rules:
      large-amount-new-account: 50000
      new-account-days: 7
      max-transfers-per-hour: 10
      night-amount: 20000
      night-end-hour: 6
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:finflow}
    secret-key: ${MINIO_ROOT_PASSWORD:finflow-minio}
    bucket: finflow-statements
