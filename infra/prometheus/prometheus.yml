global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: finflow-core
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /tmp/monitoring-token
    static_configs:
      - targets: ['finflow-core:8080']
  - job_name: finflow-ml
    metrics_path: /metrics/
    static_configs:
      - targets: ['finflow-ml:8000']
        labels:
          application: finflow-ml
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
